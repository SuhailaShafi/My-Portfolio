<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary SEO Meta Tags -->
  <meta name="description" content="Suhaila Parvin — Flutter Developer portfolio. Showcasing mobile apps built with Flutter, Dart, BLoC, Firebase, and Clean Architecture.">
  <meta name="keywords" content="Suhaila Parvin, Flutter Developer, Dart, Mobile Developer, iOS, Android, BLoC, Firebase, Portfolio">
  <meta name="author" content="Suhaila Parvin">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Suhaila Parvin | Flutter Developer Portfolio">
  <meta property="og:description" content="Flutter Developer specializing in iOS & Android apps with BLoC, Firebase, and Clean Architecture.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Suhaila Parvin | Flutter Developer Portfolio">
  <meta name="twitter:description" content="Flutter Developer specializing in iOS & Android apps with BLoC, Firebase, and Clean Architecture.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Suhaila Parvin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Suhaila Parvin | Flutter Developer Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent white flash on dark mode load */
    body {
      margin: 0;
      background-color: #0F172A;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
